<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atuatasi Family Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f7f6;
      color: #333;
    }
    header {
      background-color: #2c3e50;
      color: white;
      padding: 2rem 1rem 1rem 1rem;
      text-align: center;
    }
    header h1 {
      margin: 0 0 0.5rem 0;
    }
    header p {
      margin: 0 0 1.5rem 0;
      opacity: 0.9;
    }
    /* Navigation Bar Styling */
    nav {
      background-color: #34495e;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 0.8rem 1rem;
      flex-wrap: wrap;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.95rem;
      transition: color 0.2s ease;
    }
    nav a:hover {
      color: #1abc9c;
    }
    main {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .card {
      background: white;
      padding: 1.5rem;
      margin-bottom: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>Atuatasi Family Website</h1>
    <p>Welcome to our family hub!</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="announcements.html">Announcements</a>
    <a href="recipes.html">Recipe Hub</a>
    <a href="photos.html">Photo Vault</a>
    <a href="history.html">Family History</a>
  </nav>

  <main>
    <section class="card">
      <h2>Welcome Home</h2>
      <p>This is the central space for our family updates, recipes, memories, and history. Use the menu above to explore!</p>
    </section>
  </main>

</body>
</html>
